
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETHAN CALC</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <h1>ETHAN CALC</h1>
        <p class="subtitle">NEON CALCULATOR</p>

        <!-- Calculator Display -->
        <input type="text" id="display" value="0" readonly>

        <!-- Calculator Buttons -->
        <div class="buttons">

            <button onclick="clearDisplay()" class="special">AC</button>
            <button onclick="deleteNumber()" class="special">DEL</button>
            <button onclick="appendValue('%')" class="special">%</button>
            <button onclick="appendValue('/')" class="operator">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')" class="operator">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')" class="operator">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')" class="operator">+</button>

            <button onclick="appendValue('0')" class="zero">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="calculate()" class="equals">=</button>

        </div>

    </div>

    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
